<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Command Deck — demo E</title>
<style>
  :root {
    --bg: #0c0a06; --panel: rgba(30, 24, 12, .72); --edge: rgba(255, 180, 84, .22);
    --ink: #ffe9c4; --dim: #a8895c; --amber: #ffb454; --amber2: #ffd479; --bad: #ff7a5c;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 "SF Mono", ui-monospace, Menlo, monospace; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.14) 3px 4px); }
  body::after { content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(5,3,1,.75) 100%); }

  header { position: relative; z-index: 4; display: flex; align-items: center; gap: 18px; padding: 18px 26px; }
  .logo { font-size: 15px; letter-spacing: .35em; color: var(--amber); text-shadow: 0 0 18px rgba(255,180,84,.7); }
  .lamps { display: flex; gap: 8px; align-items: center; }
  .lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: lampblink 2s infinite; }
  .lamp.dim { background: var(--bad); box-shadow: 0 0 10px var(--bad); animation: lampblink 1s infinite; }
  @keyframes lampblink { 50% { opacity: .35; } }
  .lamps span { color: var(--dim); font-size: 10px; letter-spacing: .15em; margin-left: 6px; }

  .layout { position: relative; z-index: 2; display: grid; grid-template-columns: 300px 1fr 330px; gap: 18px; padding: 0 26px 96px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 16px 18px;
    box-shadow: 0 0 40px rgba(255,180,84,.06), inset 0 0 30px rgba(255,180,84,.04);
    opacity: 0; transform: translateY(24px); animation: rise .6s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .panel:nth-child(2) { animation-delay: .12s; } .panel:nth-child(3) { animation-delay: .24s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .panel h2 { font-size: 10px; letter-spacing: .3em; color: var(--dim); margin-bottom: 12px;
    border-bottom: 1px solid var(--edge); padding-bottom: 6px; }

  .gauge { text-align: center; margin: 14px 0 6px; }
  .gauge canvas { width: 120px; height: 70px; }
  .gauge .glabel { font-size: 10px; color: var(--dim); letter-spacing: .2em; margin-top: 2px; }
  .gauge .gval { font-size: 15px; color: var(--amber2); font-weight: 700; }

  #radarwrap { position: relative; height: 380px; }
  #radar { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sweep-label { position: absolute; right: 12px; top: 8px; font-size: 10px; color: var(--dim); letter-spacing: .2em; }

  .logline { padding: 5px 0; border-bottom: 1px solid rgba(255,180,84,.08); font-size: 11px; color: var(--dim);
    opacity: 0; animation: typein .4s forwards; }
  @keyframes typein { from { transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  .logline b { color: var(--amber2); }
  .logline .lt { color: var(--amber); }
  .logline.err b { color: var(--bad); }

  #tpschart { width: 100%; height: 130px; display: block; cursor: crosshair; }

  .ticker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; height: 44px; display: flex; align-items: center;
    background: rgba(20,15,6,.9); border-top: 1px solid var(--edge); overflow: hidden; }
  .ticker .tagline { color: var(--amber); font-size: 10px; letter-spacing: .25em; padding: 0 16px; border-right: 1px solid var(--edge); height: 100%; display: flex; align-items: center; }
  .ticker .inner { display: flex; gap: 48px; white-space: nowrap; animation: tick 40s linear infinite; padding-left: 20px; }
  @keyframes tick { to { transform: translateX(-50%); } }
  .tick-item { color: var(--dim); font-size: 11px; }
  .tick-item b { color: var(--amber2); } .tick-item .t { color: var(--amber); }
</style>
</head>
<body>
<header>
  <div class="logo">HERMES // COMMAND DECK</div>
  <div class="lamps"><span class="lamp"></span><span class="lamp"></span><span class="lamp dim"></span><span>UPLINKS 2/3</span></div>
</header>

<div class="layout">
  <div class="panel">
    <h2>ENGINE INSTRUMENTS</h2>
    <div id="gauges"></div>
  </div>

  <div class="panel">
    <h2>TACTICAL / FLEET RANGE</h2>
    <div id="radarwrap">
      <canvas id="radar"></canvas>
      <div class="sweep-label">SWEEP ACTIVE</div>
    </div>
  </div>

  <div class="panel">
    <h2>COMMS / REQUEST LOG</h2>
    <div id="comms"></div>
    <h2 style="margin-top:14px">THROUGHPUT / T·S⁻¹</h2>
    <canvas id="tpschart"></canvas>
  </div>
</div>

<div class="ticker">
  <div class="tagline">COMMS</div>
  <div class="inner" id="tickerInner"></div>
</div>

<script>
const HOSTS = [
  { id:"mini", cpu:1.2, cpuMax:8, ram:[21.4,32], angle:-.8, dist:.45, stale:false, reqs:41 },
  { id:"mbp", cpu:0.8, cpuMax:8, ram:[17.1,24], angle:.7, dist:.62, stale:false, reqs:94 },
  { id:"WinPC", cpu:null, cpuMax:8, ram:null, angle:2.6, dist:.8, stale:true, reqs:0 },
];
const LOG = [
  ["12:06:11","mbp","supergemma4-26b","18.2 t/s · 9.1s"], ["11:58:44","mbp","supergemma4-26b","16.9 t/s · 12.4s trunc"],
  ["11:52:03","mini","qwen3.6-35b-distill","45.4 t/s · 2.2s"], ["11:41:37","cloud","kimi-k2-thinking","31.0s"],
  ["11:36:20","mbp","supergemma4-26b","15.8 t/s · 14.9s"], ["11:22:08","mbp","supergemma4-26b","link error ×3","err"],
];
const TICKS = LOG.map(([t,h,m,d]) => [t,h,m,d]);
const SERIES = {
  gemma: [14,16,15,17,16,18,17,16,15,16,17,19,18,16,17,16,15,16,18,17,16,15,14,16],
  qwen:  [22,24,21,23,45,22,20,21,22,23,24,22,21,22,23,21,22,24,23,22,21,22,23,22],
};

// ---------- gauges ----------
const gaugesEl = document.getElementById("gauges");
const gaugeDefs = [];
HOSTS.forEach(h => {
  if (h.stale) return;
  ["cpu","ram"].forEach(kind => {
    const div = document.createElement("div"); div.className = "gauge";
    div.innerHTML = `<canvas width="240" height="140"></canvas><div class="gval">—</div><div class="glabel">${h.id} ${kind}</div>`;
    gaugesEl.appendChild(div);
    gaugeDefs.push({ h, kind, cv: div.querySelector("canvas"), valEl: div.querySelector(".gval"), needle: 0 });
  });
});
function drawGauge(g, t){
  const ctx = g.cv.getContext("2d"); ctx.setTransform(2,0,0,2,0,0);
  const frac = g.kind==="cpu" ? g.h.cpu/g.h.cpuMax : g.h.ram[0]/g.h.ram[1];
  g.needle += (frac - g.needle)*.04;
  const W=120, H=70, cxp=W/2, cyp=H-6, R=52;
  ctx.clearRect(0,0,W,H);
  // arc
  ctx.beginPath(); ctx.arc(cxp,cyp,R,Math.PI,0);
  ctx.strokeStyle = "rgba(255,180,84,.18)"; ctx.lineWidth = 7; ctx.stroke();
  ctx.beginPath(); ctx.arc(cxp,cyp,R,Math.PI,Math.PI + Math.PI*g.needle);
  ctx.strokeStyle = "#ffb454"; ctx.lineWidth = 7; ctx.shadowColor="#ffb454"; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
  // ticks
  for (let i=0;i<=8;i++){ const a = Math.PI + i/8*Math.PI;
    ctx.beginPath();
    ctx.moveTo(cxp+Math.cos(a)*(R-9), cyp+Math.sin(a)*(R-9));
    ctx.lineTo(cxp+Math.cos(a)*(R-14), cyp+Math.sin(a)*(R-14));
    ctx.strokeStyle = "rgba(255,180,84,.4)"; ctx.lineWidth = 1; ctx.stroke(); }
  // needle
  const na = Math.PI + Math.PI*g.needle;
  ctx.beginPath(); ctx.moveTo(cxp,cyp);
  ctx.lineTo(cxp+Math.cos(na)*(R-18), cyp+Math.sin(na)*(R-18));
  ctx.strokeStyle = "#ffe9c4"; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cxp,cyp,3,0,7); ctx.fillStyle = "#ffe9c4"; ctx.fill();
  const txt = g.kind==="cpu" ? g.h.cpu.toFixed(1) : `${g.h.ram[0]}/${g.h.ram[1]} GB`;
  g.valEl.textContent = txt;
}
(function gaugeLoop(t){ gaugeDefs.forEach(g => drawGauge(g,t)); requestAnimationFrame(gaugeLoop); })(0);

// ---------- radar ----------
const rc = document.getElementById("radar"), rctx = rc.getContext("2d");
let RW, RH;
function sizeRadar(){ const r = rc.getBoundingClientRect(); RW = r.width; RH = r.height;
  rc.width = RW*2; rc.height = RH*2; rctx.setTransform(2,0,0,2,0,0); }
sizeRadar(); addEventListener("resize", sizeRadar);
const blips = HOSTS.map(h => ({ ...h, pulse: 0 }));
let sweepA = 0;
const pings = [];
setInterval(() => { const alive = blips.filter(b=>!b.stale); if (alive.length)
  pings.push({ b: alive[Math.floor(Math.random()*alive.length)], r: 0 }); }, 1500);

(function radarLoop(t){
  rctx.clearRect(0,0,RW,RH);
  const cxp = RW/2, cyp = RH/2, R = Math.min(RW,RH)/2 - 20;
  // rings + cross
  for (let i=1;i<=4;i++){ rctx.beginPath(); rctx.arc(cxp,cyp,R*i/4,0,7);
    rctx.strokeStyle = "rgba(255,180,84,.14)"; rctx.lineWidth = 1; rctx.stroke(); }
  rctx.beginPath(); rctx.moveTo(cxp-R,cyp); rctx.lineTo(cxp+R,cyp);
  rctx.moveTo(cxp,cyp-R); rctx.lineTo(cxp,cyp+R); rctx.strokeStyle = "rgba(255,180,84,.1)"; rctx.stroke();
  // sweep
  sweepA += .012;
  const grad = rctx.createConicGradient ? null : null;
  rctx.save(); rctx.translate(cxp,cyp); rctx.rotate(sweepA);
  const sg = rctx.createLinearGradient(0,0,R,0);
  sg.addColorStop(0,"rgba(255,180,84,.25)"); sg.addColorStop(1,"transparent");
  rctx.beginPath(); rctx.moveTo(0,0); rctx.arc(0,0,R,-.35,0); rctx.closePath();
  rctx.fillStyle = sg; rctx.fill();
  rctx.beginPath(); rctx.moveTo(0,0); rctx.lineTo(R,0);
  rctx.strokeStyle = "rgba(255,180,84,.7)"; rctx.lineWidth = 1.5; rctx.stroke();
  rctx.restore();
  // blips
  blips.forEach(b => {
    const bx = cxp + Math.cos(b.angle)*b.dist*R, by = cyp + Math.sin(b.angle)*b.dist*R;
    // brighten when sweep passes
    let dA = ((sweepA - b.angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
    if (dA < .1) b.pulse = 1;
    b.pulse = Math.max(0, b.pulse - .008);
    const a = b.stale ? .35 : .45 + b.pulse*.55;
    rctx.beginPath(); rctx.arc(bx,by,5 + b.pulse*4,0,7);
    rctx.fillStyle = b.stale ? `rgba(255,122,92,${a})` : `rgba(255,180,84,${a})`;
    rctx.shadowColor = b.stale ? "#ff7a5c" : "#ffb454"; rctx.shadowBlur = 8+b.pulse*16;
    rctx.fill(); rctx.shadowBlur = 0;
    rctx.fillStyle = "rgba(255,233,196,.85)"; rctx.font = "700 10px Menlo"; rctx.textAlign = "center";
    rctx.fillText(b.id, bx, by + 18);
  });
  // request pings radiating from a host blip
  for (let i=pings.length-1;i>=0;i--){ const p = pings[i]; p.r += 1.6;
    const bx = cxp + Math.cos(p.b.angle)*p.b.dist*R, by = cyp + Math.sin(p.b.angle)*p.b.dist*R;
    rctx.beginPath(); rctx.arc(bx,by,p.r,0,7);
    rctx.strokeStyle = `rgba(255,212,121,${Math.max(0,.6-p.r/60)})`; rctx.lineWidth = 1.5; rctx.stroke();
    if (p.r > 60) pings.splice(i,1); }
  requestAnimationFrame(radarLoop);
})(0);

// ---------- comms log ----------
const comms = document.getElementById("comms");
LOG.forEach(([t,h,m,d,cls],i) => {
  const div = document.createElement("div"); div.className = "logline" + (cls?" "+cls:"");
  div.style.animationDelay = (0.6+i*0.25)+"s";
  div.innerHTML = `<span class="lt">${t}</span> <b>${h}</b> ▸ ${m} ▸ ${d}`;
  comms.appendChild(div);
});

// ---------- throughput ----------
const chart = document.getElementById("tpschart"), cx2 = chart.getContext("2d");
let progress = 0;
function sizeChart(){ chart.width = chart.clientWidth*2; chart.height = 260; cx2.setTransform(2,0,0,2,0,0); }
sizeChart(); addEventListener("resize", sizeChart);
(function drawChart(){
  const W = chart.clientWidth, H = 130, pad = 18;
  cx2.clearRect(0,0,W,H);
  cx2.strokeStyle = "rgba(255,180,84,.08)";
  for (let g=0; g<4; g++){ cx2.beginPath(); cx2.moveTo(0,pad+g*26); cx2.lineTo(W,pad+g*26); cx2.stroke(); }
  progress = Math.min(1, progress+.02);
  const cols = { gemma:"#ffb454", qwen:"#ffd479" };
  for (const [key,pts] of Object.entries(SERIES)) {
    cx2.beginPath();
    const n = Math.floor(pts.length*progress);
    for (let i=0;i<n;i++){ const x = pad+i*(W-pad*2)/23, y = H-6-pts[i]/45.4*(H-36);
      i?cx2.lineTo(x,y):cx2.moveTo(x,y); }
    cx2.strokeStyle = cols[key]; cx2.lineWidth = 1.6;
    cx2.shadowColor = cols[key]; cx2.shadowBlur = 6; cx2.stroke(); cx2.shadowBlur = 0;
  }
  requestAnimationFrame(drawChart);
})();

// ---------- ticker ----------
document.getElementById("tickerInner").innerHTML = TICKS.concat(TICKS).map(([t,h,m,d]) =>
  `<span class="tick-item"><span class="t">${t}</span> ${h} ▸ ${m} ▸ <b>${d}</b></span>`).join("");
</script>
</body>
</html>
