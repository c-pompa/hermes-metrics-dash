<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Constellation — demo D</title>
<style>
  :root {
    --bg: #07060f; --panel: rgba(18, 14, 36, .66); --edge: rgba(170, 140, 255, .16);
    --ink: #efeaff; --dim: #978fb8; --accent: #b18cff; --accent2: #ffd479; --warn: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 "SF Mono", ui-monospace, Menlo, monospace; overflow-x: hidden; }
  #map { position: fixed; inset: 0; z-index: 0; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(3,2,9,.78) 100%); }
  header { position: relative; z-index: 3; display: flex; align-items: center; gap: 18px; padding: 18px 26px; }
  .logo { font-size: 15px; letter-spacing: .35em; text-shadow: 0 0 18px rgba(177,140,255,.8); }
  .sub { color: var(--dim); font-size: 10px; letter-spacing: .2em; }

  .layout { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 330px; gap: 18px; padding: 0 26px 90px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 16px 18px;
    backdrop-filter: blur(14px); box-shadow: 0 8px 40px rgba(0,0,0,.5);
    opacity: 0; transform: translateY(24px); animation: rise .7s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .panel:nth-child(2) { animation-delay: .15s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .panel h2 { font-size: 10px; letter-spacing: .3em; color: var(--dim); margin-bottom: 12px; }

  .route { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0;
    border-bottom: 1px solid rgba(170,140,255,.08); font-size: 11px; color: var(--dim); }
  .route b { color: var(--ink); }
  .route .dev { color: var(--accent2); font-size: 10px; }
  #tpschart { width: 100%; height: 150px; display: block; cursor: crosshair; }
  .legend { display: flex; gap: 14px; font-size: 10px; color: var(--dim); margin-top: 6px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  #tooltip { position: fixed; z-index: 9; pointer-events: none; background: rgba(14,10,30,.92); border: 1px solid var(--edge);
    border-radius: 10px; padding: 10px 12px; font-size: 11px; display: none; max-width: 260px; backdrop-filter: blur(8px); }
  #tooltip b { color: var(--accent2); }

  .ticker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; height: 44px; display: flex; align-items: center;
    background: rgba(9,7,20,.85); border-top: 1px solid var(--edge); backdrop-filter: blur(10px); overflow: hidden; }
  .ticker .inner { display: flex; gap: 48px; white-space: nowrap; animation: tick 40s linear infinite; padding-left: 100vw; }
  @keyframes tick { to { transform: translateX(-100%); } }
  .tick-item { color: var(--dim); font-size: 11px; }
  .tick-item b { color: var(--accent2); } .tick-item .t { color: var(--accent); }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div class="vignette"></div>

<header>
  <div class="logo">HERMES // CONSTELLATION</div>
  <div class="sub">THE FEDERATION AS A STAR CHART</div>
</header>

<div class="layout">
  <div class="panel" style="min-height:340px">
    <h2>LINK MAP — packets are requests; they travel client → serving device</h2>
    <div style="color:var(--dim); font-size:11px">hover a star · dimmed star = stale peer</div>
  </div>
  <div class="panel">
    <h2>ROUTING TABLE</h2>
    <div id="routes"></div>
    <h2 style="margin-top:16px">THROUGHPUT / T·S⁻¹</h2>
    <canvas id="tpschart"></canvas>
    <div class="legend">
      <span><span class="sw" style="background:#b18cff"></span>supergemma4-26b</span>
      <span><span class="sw" style="background:#ffd479"></span>qwen3.6-35b-distill</span>
    </div>
  </div>
</div>

<div id="tooltip"></div>
<div class="ticker"><div class="inner" id="tickerInner"></div></div>

<script>
// ---------- data ----------
const NODES = [
  { id:"mini",  x:.30, y:.42, color:"#b18cff", stale:false, cpu:1.2, ram:[21.4,32], reqs:41,
    models:["qwen3.6-35b-distill","supergemma4-26b","nomic-embed"] },
  { id:"mbp",   x:.62, y:.60, color:"#ffd479", stale:false, cpu:0.8, ram:[17.1,24], reqs:94,
    models:["qwen3.6-35b-distill","supergemma4-26b","nomic-embed"] },
  { id:"WinPC", x:.80, y:.22, color:"#ffb454", stale:true, cpu:null, ram:null, reqs:0,
    models:["qwen3.6-27b-aggressive"] },
  { id:"cloud", x:.12, y:.74, color:"#e8e8ff", stale:false, cloud:true, cpu:null, ram:null, reqs:1,
    models:["kimi-k2-thinking"] },
];
const LINKS = [ ["mini","mbp"], ["mini","WinPC"], ["mbp","cloud"] ];
const ROUTES = [
  ["supergemma4-26b","mini + mbp"], ["qwen3.6-35b-distill","mini + mbp"],
  ["nomic-embed","mini + mbp"], ["qwen3.6-27b-aggressive","WinPC"], ["kimi-k2-thinking","cloud"],
];
const TICKS = [
  ["12:06:11","mbp","supergemma4-26b",18.2,"9.1s"], ["11:58:44","mbp","supergemma4-26b",16.9,"12.4s"],
  ["11:52:03","mini","qwen3.6-35b-distill",45.4,"2.2s"], ["11:41:37","cloud","kimi-k2-thinking",0,"31.0s"],
  ["11:36:20","mbp","supergemma4-26b",15.8,"14.9s"], ["11:22:08","mbp","supergemma4-26b",0,"ERR ×3"],
];
const SERIES = {
  gemma: [14,16,15,17,16,18,17,16,15,16,17,19,18,16,17,16,15,16,18,17,16,15,14,16],
  qwen:  [22,24,21,23,45,22,20,21,22,23,24,22,21,22,23,21,22,24,23,22,21,22,23,22],
};

// ---------- routes panel ----------
document.getElementById("routes").innerHTML = ROUTES.map(([m,d]) =>
  `<div class="route"><b>${m}</b><span class="dev">▸ ${d}</span></div>`).join("");

// ---------- ticker ----------
document.getElementById("tickerInner").innerHTML = TICKS.concat(TICKS).map(([t,h,m,tps,d]) =>
  `<span class="tick-item"><span class="t">${t}</span> ${h} ▸ ${m} ▸ <b>${tps||d}</b>${tps?" t/s":""}</span>`).join("");

// ---------- throughput chart ----------
const chart = document.getElementById("tpschart"), cx = chart.getContext("2d");
let hover = -1, progress = 0;
function sizeChart(){ chart.width = chart.clientWidth*2; chart.height = 300; cx.setTransform(2,0,0,2,0,0); }
sizeChart(); addEventListener("resize", sizeChart);
chart.addEventListener("pointermove", e => { const r = chart.getBoundingClientRect();
  hover = Math.round((e.clientX-r.left)/r.width*23); });
chart.addEventListener("pointerleave", () => hover = -1);
(function drawChart(){
  const W = chart.clientWidth, H = 150, pad = 20;
  cx.clearRect(0,0,W,H);
  cx.strokeStyle = "rgba(170,140,255,.08)";
  for (let g=0; g<5; g++){ cx.beginPath(); cx.moveTo(0,pad+g*26); cx.lineTo(W,pad+g*26); cx.stroke(); }
  progress = Math.min(1, progress+.02);
  for (const [key,pts] of Object.entries(SERIES)) {
    const col = key==="gemma" ? "#b18cff" : "#ffd479";
    cx.beginPath();
    const n = Math.floor(pts.length*progress);
    for (let i=0;i<n;i++){ const x = pad+i*(W-pad*2)/23, y = H-8-pts[i]/45.4*(H-40);
      i?cx.lineTo(x,y):cx.moveTo(x,y); }
    cx.strokeStyle = col; cx.lineWidth = 1.6; cx.shadowColor = col; cx.shadowBlur = 8; cx.stroke(); cx.shadowBlur = 0;
    if (hover>=0 && hover<pts.length){ const x = pad+hover*(W-pad*2)/23, y = H-8-pts[hover]/45.4*(H-40);
      cx.beginPath(); cx.arc(x,y,4,0,7); cx.fillStyle = col; cx.fill();
      cx.fillStyle = "#efeaff"; cx.font = "10px Menlo"; cx.fillText(`${key} ${pts[hover]} t/s`, Math.min(x+8,W-90), y-8); }
  }
  requestAnimationFrame(drawChart);
})();

// ---------- constellation map (canvas 2d) ----------
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
let W, H, DPR;
function sizeMap(){ DPR = Math.min(devicePixelRatio,2); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
sizeMap(); addEventListener("resize", sizeMap);

const px = n => ({ x: n.x*W, y: n.y*H });
// static starfield
const bg = [];
for (let i=0;i<340;i++) bg.push({ x:Math.random(), y:Math.random(), r:Math.random()*1.1+.2, tw:Math.random()*6 });

// packets
const packets = [];
function spawnPacket(){
  const cands = [ ["mbp","mini",.75], ["mbp","mbp",.1], ["mini","mini",.1], ["mbp","WinPC",.05] ];
  const r = Math.random(); let acc = 0, pick = cands[0];
  for (const c of cands){ acc += c[2]; if (r <= acc){ pick = c; break; } }
  const from = NODES.find(n => n.id===pick[0]), to = NODES.find(n => n.id===pick[1]);
  if (to.stale) return;
  const tps = [45.4,22.4,16.5,18.2][Math.floor(Math.random()*4)];
  packets.push({ from, to, t:0, speed:.003+tps/8000, color: from.id==="mbp" ? "#ffd479" : "#b18cff", tps });
}
setInterval(spawnPacket, 900);

function bez(a, b){
  const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy);
  return { cpx: mx - dy/d*40, cpy: my + dx/d*40 };
}
function bezPoint(a, c, b, t){
  const mt = 1-t;
  return { x: mt*mt*a.x + 2*mt*t*c.x + t*t*b.x, y: mt*mt*a.y + 2*mt*t*c.y + t*t*b.y };
}

let mouse = { x:-999, y:-999 }, hovered = null;
addEventListener("pointermove", e => { mouse = { x:e.clientX, y:e.clientY };
  const tip = document.getElementById("tooltip");
  tip.style.left = (e.clientX+16)+"px"; tip.style.top = (e.clientY+10)+"px"; });

const pulses = NODES.map(() => 0);
(function loop(t){
  ctx.clearRect(0,0,W,H);
  // starfield with twinkle
  bg.forEach((s,i) => {
    const a = .25 + Math.abs(Math.sin(t/900 + s.tw))*.55;
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 7);
    ctx.fillStyle = `rgba(200,190,255,${a*.5})`; ctx.fill();
  });

  // links (animated dashes)
  LINKS.forEach(([a,b], i) => {
    const na = NODES.find(n=>n.id===a), nb = NODES.find(n=>n.id===b);
    const A = px(na), B = px(nb), c = bez(A,B);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(c.cpx,c.cpy,B.x,B.y);
    ctx.strokeStyle = nb.stale ? "rgba(255,180,84,.12)" : "rgba(177,140,255,.16)";
    ctx.lineWidth = 1.2; ctx.setLineDash([6,10]); ctx.lineDashOffset = -t/40;
    ctx.stroke(); ctx.setLineDash([]);
  });

  // packets along links
  for (let i=packets.length-1;i>=0;i--){
    const p = packets[i]; p.t += p.speed;
    if (p.t >= 1){ pulses[NODES.indexOf(p.to)] = 1; packets.splice(i,1); continue; }
    const A = px(p.from), B = px(p.to), c = bez(A,B), pos = bezPoint(A,c,B,p.t);
    // trail
    for (let k=1;k<=5;k++){ const tt = Math.max(0,p.t-k*.02), tp = bezPoint(A,c,B,tt);
      ctx.beginPath(); ctx.arc(tp.x,tp.y, 3.5-k*.6, 0, 7);
      ctx.fillStyle = p.color + "33"; ctx.fill(); }
    ctx.beginPath(); ctx.arc(pos.x,pos.y,3,0,7); ctx.fillStyle = "#fff"; ctx.fill();
  }

  // nodes
  hovered = null;
  NODES.forEach((n,i) => {
    const p = px(n);
    pulses[i] = Math.max(0, pulses[i]-.02);
    const R = (n.cloud?9:14) + pulses[i]*10;
    // glow
    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*3.2);
    grad.addColorStop(0, n.color + (n.stale?"22":"55")); grad.addColorStop(1, "transparent");
    ctx.beginPath(); ctx.arc(p.x,p.y,R*3.2,0,7); ctx.fillStyle = grad; ctx.fill();
    // body
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7);
    ctx.fillStyle = n.stale ? "rgba(255,180,84,.25)" : n.color; ctx.fill();
    if (n.cloud){ ctx.setLineDash([3,3]); ctx.strokeStyle = n.color; ctx.stroke(); ctx.setLineDash([]); }
    // label
    ctx.fillStyle = n.stale ? "rgba(255,180,84,.7)" : "#efeaff";
    ctx.font = "700 12px Menlo"; ctx.textAlign = "center";
    ctx.fillText(n.id, p.x, p.y + R + 18);
    ctx.font = "10px Menlo"; ctx.fillStyle = "rgba(151,143,184,.8)";
    ctx.fillText(n.stale ? "stale" : `${n.reqs} req`, p.x, p.y + R + 32);
    if (Math.hypot(mouse.x-p.x, mouse.y-p.y) < R+12) hovered = n;
  });
  document.body.style.cursor = hovered ? "pointer" : "";

  const tip = document.getElementById("tooltip");
  if (hovered){
    tip.style.display = "block";
    tip.innerHTML = `<b>${hovered.id}</b> ${hovered.stale?"(stale)":"(live)"}<br>` +
      (hovered.cpu!=null ? `cpu ${hovered.cpu} · ram ${hovered.ram.join("/")}<br>` : "") +
      `${hovered.models.length} models · ${hovered.reqs} req/24h`;
  } else tip.style.display = "none";

  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
